name: dbt CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  validate:
    name: Validate dbt project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.12.5 dbt-databricks==1.12.7 pyarrow==15.0.0

      - name: Check dbt project configuration
        run: dbt --version